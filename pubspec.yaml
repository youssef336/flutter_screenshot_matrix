name: flutter_screenshot_matrix
description: >-
  Screenshot every screen across devices, locales, themes and text scales in
  plain flutter test, with real fonts, overflow detection and an HTML gallery.
version: 0.1.0
repository: https://github.com/youssef336/flutter_screenshot_matrix
issue_tracker: https://github.com/youssef336/flutter_screenshot_matrix/issues
topics:
  - testing
  - screenshots
  - golden
  - localization
  - accessibility

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_lints: ^6.0.0

executables:
  gallery: gallery

name: screenshot_matrix_example
description: Example app for flutter_screenshot_matrix.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_screenshot_matrix:
    path: ../
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    # Cairo covers Latin and Arabic (SIL Open Font License, see
    # assets/fonts/Cairo-OFL.txt).
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf

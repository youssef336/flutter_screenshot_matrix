name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Example (screenshot matrix)
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: example-screenshots
          path: example/screenshots/
          if-no-files-found: ignore
